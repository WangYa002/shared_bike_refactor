# nginx stream-mode reverse proxy for the bike gateway tier.
# Uses stream module (NOT http) because the FBEB wire protocol is raw TCP.
#
# 模块三双进程拓扑: bike-server-1/2 容器名沿用历史命名(不改名避免动 upstream),
# 实际运行 bike-gateway 纯网关二进制, 业务在同实例的 bike-dispatch-N 进程。
#
# Toggle single vs multi instance by marking bike-server-2 as `down`
# (or by stopping its container pair: `docker compose stop bike-server-2 bike-dispatch-2`).

worker_processes auto;

events {
    worker_connections 65535;
}

stream {
    upstream bike_backend {
        least_conn;
        server bike-server-1:8888 max_fails=3 fail_timeout=5s;
        server bike-server-2:8888 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 8888;
        proxy_pass bike_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}
