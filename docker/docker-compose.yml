services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd
      MYSQL_DATABASE: shared_bike
      MYSQL_USER: bike
      MYSQL_PASSWORD: bike_pwd
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bike", "-pbike_pwd"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---- 模块三: 实例 1 = bike-dispatch-1(建环方) + bike-server-1(纯网关) ----
  # 每实例一对进程共享一个 256MB tmpfs 卷挂 /dev/shm, BIKE_INSTANCE 区分命名。
  bike-dispatch-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: bike-dispatch-1
    # 镜像 ENTRYPOINT 是 bike-gateway, 必须清空后 command 才是完整命令行
    entrypoint: []
    command: ["/app/bike-dispatch", "/etc/bike/server.toml"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BIKE_INSTANCE: "0"
      BIKE_GATEWAY_WORKERS: "16"
      BIKE_LOG_FILE: /var/log/bike-dispatch/dispatch.log
    volumes:
      - ./server.toml:/etc/bike/server.toml:ro
      - bike-shm-1:/dev/shm
      - dispatch-logs-1:/var/log/bike-dispatch
    healthcheck:
      # 存在性+新鲜度复合检查: dispatch 每 1s touch alive 文件,
      # -mmin -0.1 = 6s 内更新过才算健康(防进程卡死后文件残留误判)。
      test: ["CMD-SHELL", "test -f /tmp/bike-dispatch0.alive && find /tmp/bike-dispatch0.alive -mmin -0.1 | grep -q ."]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 容器名 bike-server-1 保留不改: nginx upstream 按此名引用;
  # 实际运行 bike-gateway 纯网关二进制(模块三双进程拓扑)。
  bike-server-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: bike-server-1
    # io_uring 系列 syscall 被 Docker 默认 seccomp 拦截(EPERM), 需放开
    security_opt:
      - seccomp:unconfined
    depends_on:
      bike-dispatch-1:
        condition: service_healthy
    expose:
      - "8888"
    environment:
      # io_uring 网关 worker 数(= 请求环个数, 与 dispatch 侧 BIKE_GATEWAY_WORKERS 一致)
      BIKE_GATEWAY_WORKERS: "16"
      BIKE_INSTANCE: "0"
    volumes:
      - ./server.toml:/etc/bike/server.toml:ro
      - bike-shm-1:/dev/shm
      - server-logs-1:/var/log/bike-server
    restart: unless-stopped

  # ---- 模块三: 实例 2 ----
  bike-dispatch-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: bike-dispatch-2
    # 镜像 ENTRYPOINT 是 bike-gateway, 必须清空后 command 才是完整命令行
    entrypoint: []
    command: ["/app/bike-dispatch", "/etc/bike/server.toml"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BIKE_INSTANCE: "1"
      BIKE_GATEWAY_WORKERS: "16"
      BIKE_LOG_FILE: /var/log/bike-dispatch/dispatch.log
    volumes:
      - ./server.toml:/etc/bike/server.toml:ro
      - bike-shm-2:/dev/shm
      - dispatch-logs-2:/var/log/bike-dispatch
    healthcheck:
      # 存在性+新鲜度复合检查(同 bike-dispatch-1)
      test: ["CMD-SHELL", "test -f /tmp/bike-dispatch1.alive && find /tmp/bike-dispatch1.alive -mmin -0.1 | grep -q ."]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 容器名 bike-server-2 保留不改: nginx upstream 按此名引用;
  # 实际运行 bike-gateway 纯网关二进制。
  bike-server-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: bike-server-2
    # io_uring 系列 syscall 被 Docker 默认 seccomp 拦截(EPERM), 需放开
    security_opt:
      - seccomp:unconfined
    depends_on:
      bike-dispatch-2:
        condition: service_healthy
    expose:
      - "8888"
    environment:
      BIKE_GATEWAY_WORKERS: "16"
      BIKE_INSTANCE: "1"
    volumes:
      - ./server.toml:/etc/bike/server.toml:ro
      - bike-shm-2:/dev/shm
      - server-logs-2:/var/log/bike-server
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: bike-nginx
    depends_on:
      - bike-server-1
      - bike-server-2
    ports:
      - "8888:8888"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  mysql-data:
  server-logs-1:
  server-logs-2:
  dispatch-logs-1:
  dispatch-logs-2:
  # 每实例独立 tmpfs(256MB)挂 /dev/shm: shm 环文件 + FIFO 全落内存,
  # 容器重建即清空, 与 create_or_recover 残留恢复语义自洽。
  bike-shm-1:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=268435456,mode=1777
  bike-shm-2:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=268435456,mode=1777
